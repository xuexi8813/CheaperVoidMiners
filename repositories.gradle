// Convention 插件将官方 Nexus 排在前面，追加镜像无法覆盖它；直接重定向该仓库。
// 仅缺少构件时回退到官方 Nexus，镜像宕机或超时不会触发 Gradle 回退。
project.afterEvaluate {
    project.repositories.matching { it.name == "GTNH Maven" }.configureEach {
        it.url = uri("https://maven.gaytnh.com/gtnh-public")
    }
    // 回落仓库：镜像同步不完整时（如被 GT5u 钉定的 NEI 2.8.175-GTNH 等旧构件）从原 Nexus 获取
    project.repositories.maven {
        it.name = "gtnhNexusFallback"
        it.url = uri("https://nexus.gtnewhorizons.com/repository/public/")
    }
}
